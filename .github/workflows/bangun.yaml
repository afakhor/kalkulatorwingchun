name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Gradle Java Home to JDK 17
        run: echo "org.gradle.java.home=${{ steps.setup-java.outputs.path }}" >> android/gradle.properties

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Fix truncated generics & imports in lib
        run: |
          python3 - <<'EOF'
          import pathlib, re

          patterns = [
              (r'Future<List>>', 'Future<List>>'),
              (r'Future>', 'Future>'),
              (r'List<List>>', 'List<List>>'),
              (r'\bList>\s+([A-Za-z_]\w*)', r'List> \1'),
              (r'\bList>\s*([,\)])', r'List>\1'),
              (r'=\s*>\s*\[\s*\]', '= >[]'),
              (r'\?\?\s*>\s*\[\s*\]', '?? >[]'),
              (r'^Import\s+([\'"])', r'import \1'),
          ]

          for path in pathlib.Path('lib').rglob('*.dart'):
              text = path.read_text(encoding='utf-8')
              new_text = text
              for pat, rep in patterns:
                  new_text = re.sub(pat, rep, new_text, flags=re.MULTILINE)
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  print(f'Fixed: {path}')
          EOF

      - run: flutter pub get
      - run: flutter pub run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kalkulator-wingchun-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Ikhtisar file terpakai
        run: dart tool/cek_file_terpakai.dart
