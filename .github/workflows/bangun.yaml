name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Gradle Java Home to JDK 17
        run: echo "org.gradle.java.home=${{ steps.setup-java.outputs.path }}" >> android/gradle.properties

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
     
      - run: flutter pub get
      - run: flutter pub run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kalkulator-wingchun-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Ikhtisar file terpakai
        run: dart tool/cek_file_terpakai.dart
